name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Launch on the real domain: set repo variables SITE=https://madisonnetworkservices.com and BASE=/
    # (Settings > Secrets and variables > Actions > Variables). Unset = the GitHub Pages preview.
    env:
      SITE: ${{ vars.SITE }}
      BASE: ${{ vars.BASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
